# ReviewLens dashboard theme — "the data journal": warm paper, near-black ink.
# Colors mirror app/streamlit_app.py PALETTE (validated against the paper surface).

[theme]
base = "light"
primaryColor = "#6E2231"            # burgundy — interactive states, focus rings
backgroundColor = "#F5F0E6"         # warm paper
secondaryBackgroundColor = "#EFE8DA"
textColor = "#191511"               # near-black warm ink

[browser]
gatherUsageStats = false
